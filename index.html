<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I made you something 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fde3ec;--bg2:#fff1e8;--ink:#3b1f2e;--accent:#d6336c;--paper:#fffaf6;--tape:#f2c660b8;--shadow:rgba(59,31,46,.22);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1226;--bg2:#1a0d18;--ink:#ffe6ee;--accent:#ff6b9a;--paper:#3d2236;--tape:#d9a93f99;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a1226;--bg2:#1a0d18;--ink:#ffe6ee;--accent:#ff6b9a;--paper:#3d2236;--tape:#d9a93f99;--shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:'Fraunces',Georgia,serif;overflow-x:hidden}
.stage{min-height:100svh;display:grid;place-items:center;padding:28px 22px 56px}
.scene{display:none;text-align:center;max-width:420px;width:100%}
.scene.on{display:block}
h1,h2{font-weight:700;line-height:1.2;margin:0 0 14px}
h1{font-size:2.3rem}
h2{font-size:1.65rem}
.note{font-family:'Caveat',cursive;font-size:1.6rem;line-height:1.3;margin:0 0 26px}
.polaroid{position:relative;background:var(--paper);width:min(76vw,290px);margin:6px auto 30px;padding:12px 12px 46px;box-shadow:0 12px 30px var(--shadow);transform:rotate(-2.5deg)}
.scene:nth-of-type(even) .polaroid{transform:rotate(2.2deg)}
.polaroid::before{content:"";position:absolute;top:-12px;left:50%;width:84px;height:24px;margin-left:-42px;background:var(--tape);transform:rotate(3deg)}
.shot{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:linear-gradient(145deg,#f7b6c8,#ffd9c2)}
.ph{display:grid;place-items:center;aspect-ratio:4/5;background:linear-gradient(145deg,#f7b6c8,#ffd9c2);color:#7a3550;font-family:'Caveat',cursive;font-size:1.5rem;padding:16px}
.tall .shot{aspect-ratio:auto;max-height:56vh;object-fit:contain;background:#000}
.letter{background:var(--paper);max-width:340px;margin:0 auto 28px;padding:26px 24px;text-align:left;box-shadow:0 12px 30px var(--shadow);transform:rotate(-1deg)}
.letter p{font-family:'Caveat',cursive;font-size:1.55rem;line-height:1.35;margin:0 0 12px}
.letter p:last-child{margin:0;text-align:right}
.snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:9;width:44px;height:44px;border:0;border-radius:50%;background:var(--paper);color:var(--ink);font-size:1.3rem;cursor:pointer;box-shadow:0 4px 12px var(--shadow)}
.snd:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.on .shot,.on .ph{animation:develop 2.6s ease-out both}
@keyframes develop{from{filter:brightness(2.4) saturate(0) blur(7px);opacity:.25}to{filter:none;opacity:1}}
.btn{font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:999px;padding:13px 30px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 6px 16px var(--shadow);transition:transform .2s}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn.ghost{background:var(--paper);color:var(--ink)}
.row{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:70px}
.dots{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;gap:8px;justify-content:center;pointer-events:none}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--ink);opacity:.2}
.dots i.on{opacity:.8;background:var(--accent)}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.fx span{position:absolute;bottom:-40px;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.bg span{opacity:.25;animation-duration:14s!important;animation-iteration-count:infinite!important}
@media (prefers-reduced-motion:reduce){.on .shot,.on .ph{animation:none}.fx span{animation:none;display:none}}
</style>
</head>

<main class="stage" id="stage"></main>

const stage = document.getElementById("stage");
const dotsEl = document.getElementById("dots");
const scenes = [];
let idx = 0;

function photo(c) {
  return c.img
    ? `<img class="shot" src="${c.img}" alt="${c.alt || ""}">`
    : `<div class="ph">Her photo goes here</div>`;
}
function scene(html) {
  const s = document.createElement("section");
  s.className = "scene";
  s.innerHTML = html;
  stage.appendChild(s);
  scenes.push(s);
  return s;
}

scene(`<h1>Hi ${CONFIG.name} 👋</h1><p class="note">I made you a little story. ✨</p><button class="btn" data-next>Open it 💌</button>`);
CONFIG.chapters.forEach(c => {
  scene(`<div class="polaroid${c.tall ? " tall" : ""}">${photo(c)}</div><h2>${c.title}</h2><p class="note">${c.text}</p><button class="btn" data-next>Keep going 💕</button>`);
});
scene(`<div class="letter"><p>${CONFIG.name}❤️,</p><p>Talking to you has become my favorite part of every day. I catch myself smiling at my phone, waiting for your message.</p><p>I don’t have fancy words, so I made you this instead (hopefully it works). Every picture here is a little piece of how I see you: beautiful, gorgeous and so easy to be around.</p><p>I’d love to keep making memories with you, loads of ’em, if you’ll let me…</p><p>${CONFIG.from} 💌</p></div><button class="btn" data-next>One more thing 🥺</button>`);
const ask = scene(`<h1>${CONFIG.name}, will you be my girlfriend? 💕</h1><p class="note">Think carefully. 🥺</p>
  <div class="row"><button class="btn" id="yes">Yes 💖</button><button class="btn ghost" id="no">No 🙈</button></div>`);
const done = scene(`<h1>You said yes! 🎉💖</h1><p class="note">You just made me the happiest person alive. 🥹</p><p class="note">Yours, ${CONFIG.from} 💖</p>`);

scenes.forEach(() => dotsEl.appendChild(document.createElement("i")));
function show(n) {
  idx = n;
  scenes.forEach((s, i) => s.classList.toggle("on", i === n));
  [...dotsEl.children].forEach((d, i) => d.classList.toggle("on", i === n));
  dotsEl.style.display = n === scenes.length - 1 ? "none" : "flex";
}
stage.addEventListener("click", e => {
  if (e.target.closest("[data-next]")) { if (!ac) startMusic(); show(idx + 1); }
});

/* soft music-box lullaby, made right in the browser (no audio file needed) */
let ac, master, timer, playing = false, bar = 0, nextT = 0;
const STEP = 0.42;
const PROG = [
  [261.63, 329.63, 392, 523.25, 392, 329.63, 392, 659.25],
  [220, 261.63, 329.63, 440, 329.63, 261.63, 329.63, 523.25],
  [174.61, 220, 261.63, 349.23, 261.63, 220, 261.63, 440],
  [196, 246.94, 293.66, 392, 293.66, 246.94, 293.66, 493.88]
];
function note(f, t, vol) {
  [[f, vol], [f * 2, vol * 0.3]].forEach(([fr, v]) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.value = fr;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 1.5);
  });
}
function tick() {
  while (nextT < ac.currentTime + 1.2) {
    PROG[bar % 4].forEach((f, i) => note(f, nextT + i * STEP, i === 0 ? 0.2 : 0.11));
    bar++; nextT += 8 * STEP;
  }
}
function startMusic() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.6;
      const d = ac.createDelay(); d.delayTime.value = 0.34;
      const fb = ac.createGain(); fb.gain.value = 0.35;
      d.connect(fb); fb.connect(d);
      master.connect(ac.destination); master.connect(d); d.connect(ac.destination);
    }
    ac.resume();
    nextT = Math.max(nextT, ac.currentTime + 0.1);
    tick();
    clearInterval(timer);
    timer = setInterval(tick, 300);
    playing = true;
    snd.textContent = "🎵";
  } catch (err) {}
}
function stopMusic() {
  clearInterval(timer);
  if (ac) ac.suspend();
  playing = false;
  snd.textContent = "🔇";
}
const snd = document.getElementById("snd");
snd.addEventListener("click", () => (playing ? stopMusic() : startMusic()));
function chime() {
  if (!playing) return;
  [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => note(f, ac.currentTime + 0.05 + i * 0.12, 0.18));
}

/* The No button dodges, then gives up */
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const labels = ["No 🙈", "Are you sure? 🥺", "Really? 😢", "Think again 💔", "Please? 🥹", "Okay, fine… yes 🥰"];
let tries = 0;
function celebrate() {
  show(scenes.length - 1);
  chime();
  const box = document.getElementById("party");
  const em = ["💖", "💕", "✨", "🌸", "💗"];
  for (let i = 0; i < 40; i++) {
    const s = document.createElement("span");
    s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = 18 + Math.random() * 26 + "px";
    s.style.animationDuration = 3 + Math.random() * 4 + "s";
    s.style.animationDelay = Math.random() * 1.5 + "s";
    box.appendChild(s);
  }
}
yes.addEventListener("click", celebrate);
function dodge(e) {
  if (tries >= labels.length - 1) return;
  e.preventDefault();
  tries++;
  no.textContent = labels[tries];
  yes.style.transform = `scale(${1 + tries * 0.13})`;
  if (tries >= labels.length - 1) { no.classList.remove("ghost"); no.onclick = celebrate; return; }
  no.style.position = "fixed";
  no.style.left = 10 + Math.random() * (innerWidth - no.offsetWidth - 20) + "px";
  no.style.top = 10 + Math.random() * (innerHeight - no.offsetHeight - 20) + "px";
}
no.addEventListener("pointerenter", dodge);
no.addEventListener("pointerdown", dodge);

/* soft floating hearts in the background */
const bg = document.getElementById("bg");
for (let i = 0; i < 12; i++) {
  const s = document.createElement("span");
  s.textContent = "💗";
  s.style.left = Math.random() * 100 + "vw";
  s.style.fontSize = 14 + Math.random() * 20 + "px";
  s.style.animationDelay = -Math.random() * 14 + "s";
  bg.appendChild(s);
}
show(0);
</script>
</body>
</html>
